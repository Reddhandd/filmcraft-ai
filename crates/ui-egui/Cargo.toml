[package]
name = "filmcraft-ui-egui"
description = "The FilmCraft egui frontend (swappable): panels, docking, timeline, monitors, control channel"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
# Distributed modified builds retain upstream credits but must not embed ArtCraft marks.
independent-alpha = []

[dependencies]
craft-ui = { workspace = true }
filmcraft-time = { workspace = true }
filmcraft-geom = { workspace = true }
filmcraft-color = { workspace = true }
filmcraft-frame = { workspace = true }
filmcraft-media = { workspace = true }
filmcraft-project = { workspace = true }
filmcraft-tts = { workspace = true }
filmcraft-edit = { workspace = true }
filmcraft-render = { workspace = true }
filmcraft-text = { workspace = true }
filmcraft-audio-dsp = { workspace = true }
filmcraft-engine = { workspace = true }
filmcraft-format = { workspace = true }
chrono = { workspace = true, features = ["clock"] }
filmcraft-export = { workspace = true }
filmcraft-gpu = { workspace = true }
filmcraft-scopes = { workspace = true }
egui = { workspace = true }
eframe = { workspace = true, features = ["default_fonts", "wgpu", "accesskit", "clipboard"] }
serde = { workspace = true }
serde_json = { workspace = true }
# Stable content identities for recoverable memory compaction and reference snapshots.
sha2 = "=0.11.1"
log = { workspace = true }
rayon = { workspace = true }
web-time = "1"
# Unicode Bidirectional Algorithm for Arabic and Hebrew captions in reading order (MIT OR Apache-2.0).
unicode-bidi = "0.3.18"
# ArtCraft wordmark (PNG) for the About dialog and Home screen.
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

# PDF reference text extraction (MIT); bounded load and decompression APIs.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies.lopdf]
version = "=0.47.0"
default-features = false

# Thread/process CPU clocks for frame-job profiling (safe wrappers; see frames.rs).
[target.'cfg(unix)'.dependencies]
rustix = { version = "1", default-features = false, features = ["std", "time", "fs"] }
# the same clocks on Windows (GetThreadTimes / GetProcessTimes behind a safe API; MIT OR Apache-2.0)
[target.'cfg(windows)'.dependencies]
cpu-time = "1"

[dev-dependencies]
pollster = "1"
filmcraft-codecs = { workspace = true }
# the bench registers OS hardware decoders as the desktop app does (dev-dependency only: ui-egui
# itself stays OS-independent and web-portable)
filmcraft-platform = { workspace = true }
filmcraft-interchange = { workspace = true }
# A dependency's dev-dependencies do not propagate through egui_kittest: name the fonts this
# test root needs explicitly so glyph and accessibility assertions run against the bundled faces.
egui = { workspace = true, features = ["default_fonts", "monochrome_emoji_fonts"] }
egui_kittest = { workspace = true, features = ["eframe", "wgpu"] }
tempfile = "3"

# build.rs bakes contributors/contributors.json into the binary (About ▸ Contributors).
[build-dependencies]
serde_json = { workspace = true }
toml = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
getrandom = "0.4"
# Bounded EPUB ZIP/XML import; pure-Rust deflate, no scripts or external resource loading.
zip = { version = "=9.1.0", default-features = false, features = ["deflate"] }
roxmltree = { workspace = true }
redb = "=4.5.0"
# Pure-Rust requested-page rendering; no bundled fallback fonts or external CMaps.
hayro = { version = "=0.9.0", default-features = false }
# Pure-Rust inference for separately downloaded, checksummed CC-BY-SA OCR weights.
ocrs = { version = "=0.13.1", default-features = false, features = ["rten"] }
rten = { version = "=0.27.0", default-features = false, features = ["onnx_format"] }
craft-update = { workspace = true }
# Public model downloads use the same pure-Rust TLS provider as local speech models.
ureq = { version = "3", default-features = false, features = ["rustls-no-provider", "platform-verifier"] }
rustls = { version = "0.23", default-features = false }
rustls-rustcrypto = "0.0.2-alpha"
