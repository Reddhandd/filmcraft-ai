[package]
name = "filmcraft"
description = "FilmCraft desktop app"
version.workspace = true
edition.workspace = true
license.workspace = true
default-run = "filmcraft"
build = "build.rs"

[lints]
workspace = true

[features]
default = []
# Owner's Apple Silicon distribution: retain optional demo features and do not query
# the upstream editor's release channel for replacements of this AI alpha.
ai-alpha = ["whisper", "neural-voices", "filmcraft-ui-egui/independent-alpha"]
# Speech-to-text (Text panel ▸ Transcribe) with Whisper on the CPU, and model downloads.
whisper = ["filmcraft-engine/whisper", "filmcraft-engine/speech-download"]
# Natural Text to Speech voices (Kokoro-82M on the CPU, downloaded on first use).
neural-voices = ["filmcraft-engine/neural-voices"]

[dependencies]
filmcraft-engine = { workspace = true }
filmcraft-audio-dsp = { workspace = true }
filmcraft-export = { workspace = true }
filmcraft-project = { workspace = true }
filmcraft-render = { workspace = true }
filmcraft-time = { workspace = true }
filmcraft-gpu = { workspace = true }
filmcraft-ui-egui = { workspace = true }
filmcraft-platform = { workspace = true }
egui = { workspace = true }
eframe = { workspace = true, features = ["default_fonts", "wgpu", "accesskit", "clipboard", "wayland", "x11"] }
serde_json = { workspace = true }
serde = { workspace = true }
base64 = "0.23"
image = { version = "0.25", default-features = false, features = ["png"] }
ureq = "3.5"
# Native voice peer; permissive MIT OR Apache-2.0, reused rather than implementing WebRTC.
webrtc = "0.21.1"
rtc = "0.21.1"
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync", "macros", "process", "io-util"] }
async-trait = "0.1"
bytes = "1"
# Constant-time comparison of control-channel credentials.
subtle = "2.6"
getrandom = "0.4"
log = { workspace = true }
rfd = { workspace = true }
cpal = "0.18"
# Files and images on the system clipboard for Paste (#611); egui already uses it for text.
arboard = "3"
chrono = { workspace = true, features = ["clock"] }
sys-locale = "0.3"
# Help menu / About / Discord links in the system browser (MIT; as PhotoCraft).
open = "5"

tempfile = "3"

[dev-dependencies]
glob = "0.3"
# graphics.rs: enumerate the real adapters in a test.
pollster = "1"

[target.'cfg(target_os = "macos")'.dependencies]
pollster = "1"
muda = "0.21"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSProcessInfo", "NSString", "NSArray", "NSBundle"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSResponder", "NSWindow"] }
objc2 = "0.6"
# Same winit as eframe: macOS event-loop options (no app activation when driven by an agent).
winit = { version = "0.30", default-features = false }

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
winit = { version = "0.30", default-features = false, features = ["x11"] }

[target.'cfg(target_os = "linux")'.dependencies]
# Settings ▸ Appearance ▸ Sync with system: the XDG desktop portal's colour scheme. The zbus the
# portal file dialogs (rfd) and accesskit already use.
zbus = "6.2"

# Icon + VERSIONINFO for filmcraft.exe (build.rs); only needed when building on Windows.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[target.'cfg(windows)'.dependencies]
craft-update = { workspace = true }
